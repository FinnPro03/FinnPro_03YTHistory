<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FinnPro_03YTHistory</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111111;
            color: white;
            font-family: Arial, sans-serif;
        }

        /* PROFILE */

        .profile {
            padding: 45px 20px 35px;
            text-align: center;
        }

        .profile-picture {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff3030;
        }

        .profile h1 {
            margin: 15px 0 8px;
            font-size: 30px;
        }

        .subscribers {
            margin: 0 0 12px;
            color: #bdbdbd;
            font-size: 15px;
        }

        .youtube-link {
            color: #ff4545;
            font-size: 13px;
            text-decoration: none;
        }

        .youtube-link:hover {
            text-decoration: underline;
        }

        /* ARCHIVE */

        .archive {
            max-width: 1100px;
            margin: 0 auto;
            padding: 25px 20px 60px;
            border-top: 1px solid #303030;
        }

        .archive h2 {
            font-size: 26px;
            margin: 0 0 8px;
        }

        .archive-description {
            color: #999999;
            font-size: 14px;
            margin: 0 0 28px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 22px;
        }

        /* VIDEO CARD */

        .video-card {
            background: #1c1c1c;
            border: 1px solid #303030;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
        }

        .video-card:hover {
            transform: translateY(-3px);
            border-color: #ff4545;
        }

        .thumbnail-link {
            display: block;
            line-height: 0;
        }

        .thumbnail-link:hover {
            opacity: 0.85;
        }

        .thumbnail,
        .thumbnail-placeholder {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            display: block;
            background: #292929;
        }

        .thumbnail-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999999;
            font-size: 14px;
            line-height: 1.4;
            text-align: center;
            padding: 15px;
        }

        .video-info {
            padding: 14px;
        }

        .video-info h3 {
            font-size: 16px;
            line-height: 1.4;
            margin: 0 0 14px;
            overflow-wrap: anywhere;
        }

        .video-details {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .detail {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .detail-label {
            color: #888888;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .detail-value {
            color: #dddddd;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        /* VISIBILITY BADGES */

        .visibility {
            display: inline-block;
            width: fit-content;
            padding: 5px 8px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: bold;
        }

        .visibility.public {
            background: #173c27;
            color: #75e69c;
        }

        .visibility.unlisted {
            background: #493819;
            color: #ffce72;
        }

        .visibility.private {
            background: #492020;
            color: #ff8585;
        }

        /* MOBILE */

        @media (max-width: 700px) {
            .video-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
            }

            .archive {
                padding: 22px 12px 40px;
            }

            .profile {
                padding-top: 35px;
            }

            .profile-picture {
                width: 105px;
                height: 105px;
            }

            .video-info {
                padding: 11px;
            }
        }

        @media (max-width: 380px) {
            .video-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- PROFILE HEADER -->

    <header class="profile">
        <img
            src="FinnPro03.jpg"
            alt="FinnPro_03 Profile Picture"
            class="profile-picture"
        >

        <h1>Finn</h1>

        <p class="subscribers">1.24K Subscribers</p>

        <a
            class="youtube-link"
            href="https://youtube.com/@FinnPro_03/"
            target="_blank"
            rel="noopener noreferrer"
        >
            Check out FinnPro_03
        </a>
    </header>

    <!-- VIDEO ARCHIVE -->

    <main class="archive">
        <h2>Video Archive</h2>

        <p class="archive-description">
            Every upload. Every era. The complete FinnPro_03 history.
        </p>

        <div class="video-grid">

            <!-- VIDEO #1 -->

            <article class="video-card">

                <!-- Private videos have no clickable thumbnail. -->
                <div class="thumbnail-placeholder">
                    <img
                        src="Skibidi Toilet 1 But Paper.jpg"
                        alt="Skibidi Toilet 1 but paper thumbnail"
                        class="thumbnail"
                    >
                </div>

                <div class="video-info">
                    <h3>Skibidi Toilet 1 but paper</h3>

                    <div class="video-details">

                        <div class="detail">
                            <span class="detail-label">Number</span>
                            <span class="detail-value">1</span>
                        </div>

                        <div class="detail">
                            <span class="detail-label">Type</span>
                            <span class="detail-value">Short</span>
                        </div>

                        <div class="detail">
                            <span class="detail-label">Visibility</span>
                            <span class="visibility private">
                                PRIVATE
                            </span>
                        </div>

                        <div class="detail">
                            <span class="detail-label">Uploaded</span>
                            <span
                                class="detail-value time-ago"
                                data-date="2023-12-19"
                                title="19 December 2023"
                            >
                                Loading...
                            </span>
                        </div>

                    </div>
                </div>

            </article>

        </div>
    </main>

    <!-- AUTOMATIC TIME-AGO SYSTEM -->

    <script>
        function updateTimeAgo() {
            const now = new Date();

            document.querySelectorAll(".time-ago").forEach(element => {
                const uploadDate = new Date(
                    element.dataset.date + "T00:00:00"
                );

                let years = now.getFullYear() -
                    uploadDate.getFullYear();

                let months = now.getMonth() -
                    uploadDate.getMonth();

                let days = now.getDate() -
                    uploadDate.getDate();

                if (days < 0) {
                    months--;
                }

                if (months < 0) {
                    years--;
                }

                if (years > 0) {
                    element.textContent =
                        years + (years === 1 ? " Year Ago" : " Years Ago");
                } else if (months > 0) {
                    element.textContent =
                        months + (months === 1 ? " Month Ago" : " Months Ago");
                } else {
                    const difference = Math.max(
                        0,
                        Math.floor(
                            (now.getTime() - uploadDate.getTime()) /
                            (1000 * 60 * 60 * 24)
                        )
                    );

                    if (difference === 0) {
                        element.textContent = "Today";
                    } else {
                        element.textContent =
                            difference +
                            (difference === 1 ? " Day Ago" : " Days Ago");
                    }
                }
            });
        }

        updateTimeAgo();

        // Refresh the labels every hour.
        setInterval(updateTimeAgo, 60 * 60 * 1000);
    </script>

</body>
</html>
